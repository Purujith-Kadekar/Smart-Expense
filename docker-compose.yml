# Outlay — full local stack.
#
#   docker-compose up --build
#   open http://localhost:5173
#
# Nothing here touches real AWS. LocalStack stands in for S3, DynamoDB, SNS
# and SES; credentials are the dummy "test"/"test" pair LocalStack expects.
#
# First build takes 5-10 minutes and produces a ~2 GB backend image, because
# EasyOCR pulls in CPU PyTorch and its model weights are baked in at build
# time so the running container needs no network. Set OCR_ENGINE=tesseract
# (and see backend/Dockerfile) if you want the 300 MB image instead.

services:
  # --- LocalStack: S3 + DynamoDB + SNS + SES ---
  # 3.8.1 Community needs no auth token and works fully offline. If you ever
  # see a token prompt, you have pulled a Pro image tag, not Community.
  localstack:
    image: localstack/localstack:3.8.1
    container_name: outlay-localstack
    ports:
      - "4566:4566"          # single edge port for every service
    environment:
      - SERVICES=s3,dynamodb,sns,ses
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      # ⚠ DATA LOSS WARNING: LocalStack COMMUNITY keeps all state (DynamoDB
      # tables, S3 objects) in container memory only — `docker compose
      # down/stop/restart` (or a rebuild after code changes) WIPES every
      # account, budget and receipt. PERSISTENCE=1 activates disk snapshots
      # on LocalStack PRO (Community ignores it — harmless to leave at 1;
      # the localstack-data volume below is only used when snapshots are
      # active). For durable storage without Pro: point the backend at real
      # AWS DynamoDB — see README "Storage & persistence".
      - PERSISTENCE=1
      # No DOCKER_HOST / docker.sock mount: we never ask LocalStack to spawn
      # a Lambda container. The backend imports and calls the handler in
      # process, which is faster and removes the socket mount entirely.
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- One-shot: create bucket + tables + SNS topic, then exit ---
  localstack-init:
    image: python:3.11-slim
    container_name: outlay-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      # To create the tables in REAL AWS instead (durable demo storage), run
      # on the host instead of here:  python localstack/init.py --aws
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET=receipts-bucket
      - TABLE_NAME=ExpenseRecords
      - USERS_TABLE_NAME=Users
      - BUDGETS_TABLE_NAME=Budgets
      - SNS_TOPIC_NAME=ExpenseAlerts
    volumes:
      - ./localstack:/work
    working_dir: /work
    command: >
      bash -c "pip install --quiet --no-cache-dir -r requirements.txt && python init.py"
    restart: "no"

  # --- Backend: Flask API + local OCR + the Lambda handler ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # easyocr (default, accurate, big) | tesseract (fast, small)
        OCR_ENGINE: easyocr
    container_name: outlay-backend
    depends_on:
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      # Backend -> LocalStack, over the compose network.
      - AWS_ENDPOINT_URL=http://localstack:4566
      # Browser -> LocalStack, from the host. Used ONLY to sign presigned
      # URLs. The browser cannot resolve the hostname "localstack", and a
      # SigV4 signature covers the Host header, so the signing client must
      # point at the address the browser will actually call.
      - AWS_PUBLIC_ENDPOINT_URL=http://localhost:4566
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      # Dummy credentials. They must be set: without them boto3 falls back
      # to the IMDS chain and hangs for ~5s per call trying to reach
      # 169.254.169.254.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Must match what localstack-init creates.
      - S3_BUCKET=receipts-bucket
      - TABLE_NAME=ExpenseRecords
      - USERS_TABLE_NAME=Users
      - BUDGETS_TABLE_NAME=Budgets
      # LocalStack always uses account id 000000000000.
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:ExpenseAlerts
      - OCR_ENGINE=easyocr
      - EASYOCR_MODULE_PATH=/opt/easyocr
      - BUDGET_LIMIT=20000
      # FX conversion (receipt currency -> INR, frozen at upload).
      # FX_API_URL is the free keyless live-rate feed, fetched automatically
      # by the ingestion pipeline — no exchange-rates UI exists. FX_CACHE_TTL
      # keeps bursts of uploads from re-fetching it for every receipt (60s),
      # FX_TIMEOUT keeps a dead network from stalling ingestion (3s, then
      # the built-in fallback rates are used and records are stamped
      # fx_source="fallback").
      - FX_API_URL=https://open.er-api.com/v6/latest/INR
      - FX_CACHE_TTL=60
      - FX_TIMEOUT=3
      - JWT_SECRET=docker-compose-dev-secret-change-in-production
      - JWT_EXPIRY_HOURS=24
      - SES_VERIFIED_SENDER=noreply@outlay.local
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4566
      # MOCK_AWS is deliberately unset: real boto3 calls, aimed at LocalStack.
      - FLASK_DEBUG=0
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous: the first request loads the EasyOCR models into memory.
      start_period: 40s

  # --- Frontend: React build served by nginx ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: outlay-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  localstack-data:
