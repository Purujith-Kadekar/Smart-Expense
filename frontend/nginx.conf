# Outlay frontend nginx config
#
# - Serves the built React static assets from /usr/share/nginx/html
# - Proxies /api/* to the backend container (named "backend" in docker-compose)
# - Falls back to index.html for any path that doesn't match a real file,
#   so React Router handles client-side routes like /dashboard, /upload,
#   /settings, /login, /register

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy — forwards /api/* to the Flask backend container.
    # The browser sees same-origin requests (no CORS needed in docker-compose
    # mode), which is cleaner than the cross-origin setup used in `npm run dev`.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS preflight — pass through to Flask.
        if ($request_method = OPTIONS) {
            proxy_pass http://backend:5000;
        }
    }

    # Health check proxy (optional — lets the frontend container's nginx
    # health-check the backend through the same internal network).
    location = /health {
        proxy_pass http://backend:5000/health;
    }

    # Static files — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any path that isn't a real file goes to index.html
    # so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
